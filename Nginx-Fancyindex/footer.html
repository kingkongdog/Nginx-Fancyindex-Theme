    <script>
    (function () {
        'use strict';

        // Wait for required libraries to be available
        if (typeof showdown === 'undefined') {
            console.warn('Showdown library not loaded, markdown rendering disabled');
            return;
        }

        if (typeof DOMPurify === 'undefined') {
            console.warn('DOMPurify library not loaded, markdown rendering disabled for security');
            return;
        }

        const converter = new showdown.Converter({ tables: true });

        function findListingLink(name) {
            const links = document.querySelectorAll('#list tbody tr td a');
            return Array.from(links).find(link => link.textContent.trim() === name) || null;
        }

        function removeElement(element) {
            element?.remove();
        }

        function renderMarkdown(targetId, source) {
            const target = document.getElementById(targetId);
            if (!target || !findListingLink(source)) {
                removeElement(target);
                return;
            }

            // Show loading state
            target.innerHTML = '<p class="markdown-loading" style="color: var(--muted); font-style: italic; padding: 1rem;">Loading...</p>';

            fetch(source)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.text();
                })
                .then(text => {
                    const normalized = text.replace(/\n[ ]*/g, '\n');
                    const html = converter.makeHtml(normalized);
                    // Sanitize HTML with DOMPurify before inserting
                    const clean = DOMPurify.sanitize(html, {
                        ALLOWED_TAGS: ['h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'p', 'br', 'strong', 'em', 'u', 'code', 'pre', 'a', 'ul', 'ol', 'li', 'table', 'thead', 'tbody', 'tr', 'th', 'td', 'blockquote', 'hr', 'img'],
                        ALLOWED_ATTR: ['href', 'src', 'alt', 'title', 'class', 'id', 'width', 'height', 'loading']
                    });
                    target.innerHTML = clean;
                })
                .catch(() => {
                    removeElement(target);
                });
        }

        renderMarkdown('raw_include_HEADER_md', 'HEADER.md');
        renderMarkdown('raw_include_README_md', 'README.md');
    }());
    </script>



    <!-- 简约视频弹窗容器 -->
    <style>
        /* 播放器窗口：最大宽度设为 1200px */
        .video-box {
            position: relative;
            width: 90%;
            max-width: 1200px;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            overflow: hidden;
        }

        /* 关闭按钮：默认隐藏 */
        .video-box #closeVideoModal {
            position: absolute;
            top: 10px;
            right: 15px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 32px;
            cursor: pointer;
            z-index: 20;
            line-height: 1;
            font-family: sans-serif;
            text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: opacity 0.2s ease, color 0.2s ease;
            pointer-events: none; /* 隐藏时不可点击 */
        }

        /* 鼠标悬浮在视频区域（.video-box）时显示关闭按钮 */
        .video-box:hover #closeVideoModal {
            opacity: 1;
            pointer-events: auto; /* 显现后恢复点击事件 */
        }

        .video-box #closeVideoModal:hover {
            color: #ff4d4d;
        }
    </style>
    <div id="videoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; justify-content:center; align-items:center;">
    <div class="video-box">
        <!-- 关闭按钮 -->
        <span id="closeVideoModal">&times;</span>
        <!-- 原生 HTML5 视频播放器 -->
        <video id="videoPlayer" controls style="width:100%; height:auto; display:block; outline:none;"></video>
    </div>
    </div>

    <script>
    (function() {
    // 匹配常见视频后缀
    const videoRegex = /\.(mp4|webm|ogg|mov|m4v|mkv)$/i;
    
    const modal = document.getElementById('videoModal');
    const player = document.getElementById('videoPlayer');
    const closeBtn = document.getElementById('closeVideoModal');

    // 关闭弹窗并释放资源
    function closeModal() {
        player.pause();
        player.src = '';
        modal.style.display = 'none';
    }

    // 事件委托：拦截页面中所有的 <a> 标签点击
    document.addEventListener('click', function(e) {
        const target = e.target.closest('a');
        if (!target) return;

        const href = target.getAttribute('href');
        if (href && videoRegex.test(href)) {
            e.preventDefault(); // 阻止浏览器直接跳转/下载
            
            player.src = href;
            modal.style.display = 'flex';
            player.play().catch(function() {}); // 播放视频
        }
    });

    // 点击关闭按钮
    closeBtn.addEventListener('click', closeModal);

    // 点击遮罩空白区域关闭
    modal.addEventListener('click', function(e) {
        if (e.target === modal) closeModal();
    });

    // 按下 ESC 键关闭
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && modal.style.display === 'flex') {
            closeModal();
        }
    });
    })();
    </script>
